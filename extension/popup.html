<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 290px; font: 14px system-ui, sans-serif; padding: 14px; margin: 0; color: #1c1b1a; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { color: #6b6660; font-size: 12px; margin: 0 0 12px; line-height: 1.45; }
    label { display: block; font-size: 12px; color: #6b6660; margin: 10px 0 3px; }
    input { width: 100%; padding: 7px 9px; border: 1px solid #d4cec5; border-radius: 7px; font: inherit; box-sizing: border-box; }
    button { width: 100%; margin-top: 12px; padding: 8px; background: #7c4f2a; color: #fff; border: 0; border-radius: 7px; font: inherit; cursor: pointer; }
    #s { font-size: 12px; margin-top: 9px; text-align: center; color: #2f6b4f; }
  </style>
</head>
<body>
  <h1>Praca na miarę</h1>
  <p>Otwórz ogłoszenie na Pracuj.pl, OLX, LinkedIn, theProtocol, JustJoin lub NoFluffJobs i kliknij przycisk w prawym dolnym rogu strony.</p>
  <label>Adres aplikacji</label>
  <input id="u" placeholder="http://localhost:3000" />
  <label>Token (ten sam co INGEST_TOKEN w .env.local)</label>
  <input id="t" type="password" placeholder="wklej token" />
  <button id="b">Zapisz ustawienia</button>
  <div id="s"></div>
  <script src="popup.js"></script>
</body>
</html>
